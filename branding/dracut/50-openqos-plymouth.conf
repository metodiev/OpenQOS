# OpenQOS: put the OpenQOS boot splash theme, and what it needs to draw, into the
# initramfs.
#
# Why this file exists
# --------------------
# The theme is selected through KIWI's <bootsplash-theme>, which runs
# `plymouth-set-default-theme openqos` inside the image. That is why
# /etc/plymouth/plymouthd.conf reads Theme=openqos, and it is enough for Plymouth
# once the real root filesystem is mounted.
#
# It is not enough for the first seconds of the boot. The splash on screen before
# the switch to root is drawn by Plymouth running *out of the initramfs*, and that
# copy reads its theme from the initramfs rather than from /etc. Fedora's dracut
# tries to copy the configured theme in, but only under conditions, while it copies
# /usr/share/pixmaps/system-logo-white.png from fedora-logos unconditionally.
#
# The result was an initramfs that set Theme=openqos and contained no openqos
# theme, so Plymouth fell back to a theme that was bundled -- and the spinner
# watermark is the Fedora logo. That was the Fedora logo on the boot screen: not a
# misconfigured theme, but a theme that never arrived.
#
# install_items is dracut's documented way to name files that must be present
# regardless of dracut's own heuristics, so none of this depends on them any more.
#
# Why the plugin and the renderers are listed too
# ----------------------------------------------
# The theme files alone are not enough, and the reason is worth recording because
# it is not obvious from the initramfs:
#
#   * Most of this list used to arrive *by accident*. Fedora's
#     plymouth-theme-spinner requires plymouth-plugin-two-step at an exact
#     version, and dracut installed the plugin and the libraries it needs as part
#     of handling that theme. OpenQOS excludes plymouth-theme-spinner so the
#     Fedora logo stops appearing at boot, and doing so silently removed
#     two-step.so as well. two-step is the module our own theme declares, so the
#     theme would have been present and still unloadable.
#
#   * The renderers are what actually paint the screen, and dracut does not
#     install them for a theme it did not choose. Without them Plymouth has
#     nothing to draw with in the initramfs and falls back to text.
#
# Paths are /usr/lib64, which is where Fedora puts these on both of the
# architectures this distribution builds for, x86_64 and aarch64. dracut warns
# about an install_items entry that does not exist, so a profile that installs
# openqos-branding without Plymouth will produce warnings rather than a failure.

install_items+=" /usr/share/plymouth/themes/openqos/openqos.plymouth /usr/share/plymouth/themes/openqos/watermark.png /usr/lib64/plymouth/two-step.so /usr/lib64/plymouth/label-freetype.so /usr/lib64/plymouth/renderers/drm.so /usr/lib64/plymouth/renderers/frame-buffer.so /usr/lib64/libply-splash-graphics.so.5 "
