# Anaconda configuration for OpenQOS Linux.
#
# Anaconda chooses exactly one profile from /etc/anaconda/profile.d, matching
# the values in the *running system's* /etc/os-release against each profile's
# [Profile Detection] block. Fedora ships a profile per product (fedora,
# fedora-kde, fedora-server, ...) and one per RHEL-like distribution; without a
# profile of our own none of them matches ID=openqos, Anaconda logs "Unable to
# find any suitable configuration files for the detected os-release values. No
# profile configuration will be used." and the installer falls back to the bare
# /etc/anaconda/anaconda.conf — Fedora's defaults with no product identity and no
# product decisions, which is why an unbranded installer offers LVM where OpenQOS
# ships btrfs.
#
# Inheritance is deliberate. OpenQOS is built from Fedora and keeps Fedora's
# repositories, GPG keys and mirror infrastructure, so the base profile is the
# truthful description of most of the installer's configuration and the overrides
# below are exactly where OpenQOS differs. Reading this file should be enough to
# know what OpenQOS changes about installing Fedora.
#
# docs/architecture.md §4.7 explains the installer as a whole.

[Profile]
profile_id = openqos

# Fedora's own baseline, then the overrides below.
base_profile = fedora

[Profile Detection]
# Matched against /etc/os-release, which openqos-release installs:
# ID=openqos in packages/openqos-release/os-release.
os_id = openqos

[Storage]
# The images use btrfs with zstd:1 (kiwi/openqos/disk.xml), and this is what the
# installer's automatic partitioning scheme reads. The exact layout — 100 MiB
# ESP, subvolumes root/boot/home/var, a volume labelled "openqos" — is defined
# for installations by kickstart/openqos.ks, which is what both the interactive
# launcher and the unattended path hand to Anaconda. This profile is what keeps
# the two consistent when a user changes the storage page by hand.
default_scheme = BTRFS
btrfs_compression = zstd:1

[Bootloader]
# \EFI\openqos rather than \EFI\fedora: the firmware boot menu is user-visible
# and should name the distribution that was installed.
efi_dir = openqos

[Localization]
# Fedora's base profile asks geoip.fedoraproject.org to guess the timezone. That
# is Fedora's infrastructure, it discloses the installing machine's address to
# it, and an independent distribution should not need someone else's service to
# install. Turning it off is why the date and time page stays visible below: with
# no geolocation there has to be somewhere for the user to set a timezone.
use_geolocation = False

[User Interface]
# Fedora's KDE profile points this at Fedora's installer stylesheet, which
# fedora-logos provides. Inheriting that would style OpenQOS's installer as
# Fedora's, so it is cleared rather than replaced: the Anaconda Web UI in Fedora
# 44 does not read this option at all (the string appears nowhere in
# /usr/share/cockpit/anaconda-webui), so there is nothing to point it at, and the
# installer's only branding is the product name it reads from PRETTY_NAME in
# /etc/os-release — which is already ours.
custom_stylesheet =

# Account creation is left to Plasma Setup, the first-boot wizard. That is Fedora
# KDE's choice as well, and it is what the disk images do: kickstart/openqos.ks
# installs a locked root and no user, and refuses to finish unless the wizard is
# present and enabled. Fedora's KDE profile additionally hides the date and time
# page; OpenQOS keeps it, because geolocation is off.
hidden_webui_pages =
    anaconda-screen-accounts
