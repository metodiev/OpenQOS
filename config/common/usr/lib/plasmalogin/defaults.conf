# OpenQOS login screen defaults.
#
# This file configures Plasma Login, the display manager Plasma 6.7 ships in place
# of SDDM (plasmalogin.service, replacing sddm.service). Upstream's own README names
# this path as the distribution's hook, in as many words: user settings live in
# /etc/plasmalogin.conf, which overrides this file, and a distribution sets its
# default wallpaper or login session here.
#
# It replaces the file of the same name from Fedora's kde-settings-plasmalogin,
# which pointed the greeter at Fedora's wallpaper package. That pointer is the only
# part of Fedora's file that was branding, and it is the only part changed.
#
# Two things about the greeter worth knowing, because they are why this file is
# short:
#
#   * It is a Plasma application. Its colours, fonts, icon theme and style come from
#     /etc/xdg/kdeglobals, which OpenQOS already owns — so the OpenQOS colour scheme
#     themes the login screen too. There is no separate greeter theme to write, and
#     nothing here duplicates what the colour scheme already decides.
#
#   * The wallpaper value is not a path to an image, and not a directory either.
#     Plasma's own schema for this plugin describes the key as "wallpaper image
#     path *or wallpaper name*", and a bare name is the form the desktop itself
#     uses in its look-and-feel defaults — so the greeter and the desktop resolve
#     the same package the same way.
#
#     An earlier version pointed it at the package directory as a file URL,
#     `file:///usr/share/wallpapers/OpenQOS/`, copying Fedora's configuration.
#     That form is the plugin's "pick a random image from this folder" mode, and
#     the folder holds no images of its own — they live in contents/images/ — so
#     what the greeter did with it was unreliable: one captured frame showed the
#     OpenQOS wallpaper and the next showed Plasma's built-in default.

[Greeter]
WallpaperPlugin=org.kde.image

[Greeter][Wallpaper][org.kde.image][General]
Image=OpenQOS
PreviewImage=OpenQOS
